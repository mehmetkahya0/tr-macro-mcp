[project]
name = "tr-macro-mcp"
version = "0.1.0"
description = "MCP server for Turkish macroeconomic data and TCMB documents, with citations."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Mehmet Kahya" }]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "duckdb>=1.3,<2",
    "defusedxml>=0.7,<1",
    "platformdirs>=4,<5",
    "tzdata>=2025.1; sys_platform == 'win32'",
    "pypdfium2>=5,<6",
]

# `rag` (Phase 5) and `eval` (Phase 4) extras are added in their phases.
[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
    "mypy>=2,<3",
]

[project.scripts]
tr-macro-mcp = "tr_macro_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tr_macro_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
# Turkish text (ı, İ, ş, ...) is intentional in this project.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["defusedxml.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = ["live: hits the real network; excluded by default, run with -m live"]
